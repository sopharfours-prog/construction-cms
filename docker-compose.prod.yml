# Production stack on one Linux server (see DEPLOYMENT.md):
#   Nginx (TLS, the only public service) → Next.js app → PostgreSQL, MinIO
#
#   cp deploy/env.production.example .env.production   # fill it in
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Only Nginx publishes ports. The app, database and object storage are on an
# internal network, so the app only ever sees requests that came through
# Nginx (which overwrites X-Forwarded-For: rate limits and audit IPs can't be spoofed).
name: construction-cms

x-app-env: &app-env
  NODE_ENV: production
  NEXT_PUBLIC_SITE_URL: https://${DOMAIN:?set DOMAIN}
  AUTH_URL: https://${DOMAIN}
  AUTH_TRUST_HOST: "true"
  AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
  DATABASE_URL: postgresql://${POSTGRES_USER:-cms}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-construction_cms}?schema=public
  ALLOW_INDEXING: ${ALLOW_INDEXING:-false}
  ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
  ALLOW_CHAT: ${ALLOW_CHAT:-true}
  STORAGE_DRIVER: s3
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_BUCKET: ${S3_BUCKET:-cms}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
  S3_PUBLIC_URL: https://${DOMAIN}/files
  S3_FORCE_PATH_STYLE: "true"
  IMAGES_ALLOW_LOCAL_IP: ${IMAGES_ALLOW_LOCAL_IP:-false}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  GOOGLE_ANALYTICS_ID: ${GOOGLE_ANALYTICS_ID:-}

# Baked into the image (see Dockerfile): changing any of these needs --build.
x-build-args: &build-args
  NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
  STORAGE_DRIVER: s3
  S3_PUBLIC_URL: https://${DOMAIN}/files
  IMAGES_ALLOW_LOCAL_IP: ${IMAGES_ALLOW_LOCAL_IP:-false}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-construction_cms}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  # MinIO's own images are no longer published; this is the maintained community
  # build of the same server. Any S3-compatible storage works (see DEPLOYMENT.md).
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      # Admin console for the server itself only (use an SSH tunnel), never public.
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  # One-off: create the bucket; objects under public/ are readable by anyone,
  # everything else (private/ customer attachments) is not. Also used by
  # scripts/backup.sh and for restores (scripts/storage.ts export | import).
  storage-init:
    build:
      context: .
      target: tools
      args: *build-args
    image: construction-cms-tools
    environment: *app-env
    command: ["npx", "tsx", "scripts/storage.ts", "init"]
    depends_on:
      minio: { condition: service_healthy }
    networks: [internal]

  # One-off: apply database migrations before the app starts.
  migrate:
    build:
      context: .
      target: tools
      args: *build-args
    image: construction-cms-tools
    environment:
      <<: *app-env
      # Seed only (docker compose … run --rm migrate npm run db:seed); the app never sees these.
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_SAMPLE_DATA: ${SEED_SAMPLE_DATA:-false}
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]

  app:
    build:
      context: .
      target: runner
      args: *build-args
    image: construction-cms
    restart: unless-stopped
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      S3_BUCKET: ${S3_BUCKET:-cms}
    volumes:
      - ./deploy/nginx/templates:/etc/nginx/templates:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
    depends_on:
      app: { condition: service_healthy }
    networks: [internal]

  # Renews Let's Encrypt certificates (first issue: see DEPLOYMENT.md).
  certbot:
    image: certbot/certbot:v3.3.0
    restart: unless-stopped
    volumes:
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done",
      ]

volumes:
  postgres-data:
  minio-data:

networks:
  internal:
