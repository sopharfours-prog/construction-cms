name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: construction_cms_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/construction_cms_test?schema=public
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: ci-admin-password-2026
      SEED_DEMO_USER_PASSWORD: ci-demo-password-2026
      SEED_SAMPLE_DATA: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck, lint, format, unit tests
        run: npm run check
      - name: Migrate and seed
        run: npm run db:deploy && npm run db:seed
      - name: Integration tests
        run: npm run test:integration
      - name: Production build
        run: npm run build

  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: construction_cms_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/construction_cms_e2e?schema=public
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: ci-admin-password-2026
      SEED_DEMO_USER_PASSWORD: ci-demo-password-2026
      SEED_SAMPLE_DATA: "true"
      E2E_ADMIN_PASSWORD: ci-admin-password-2026
      E2E_DEMO_PASSWORD: ci-demo-password-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:deploy && npm run db:seed
      - run: npm run build
      - name: End-to-end tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
